name: Automated Pytest Test Suite (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify lockfile is in sync
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run unit tests
        env:
          ENVIRONMENT: test
        run: uv run pytest -v tests/units

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: codebase-schema-auditor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container imports
        run: |
          docker run --rm codebase-schema-auditor:ci \
            python -c "from services.read_path import ReadPath; from schema.read_path import ReadFileSliceRequest; print('Container OK')"
